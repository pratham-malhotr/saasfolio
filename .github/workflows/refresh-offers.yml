name: Refresh SaaS offers
on:
  schedule:
    - cron: "17 4,16 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: refresh-offers
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:offers
      - run: npm run catalog:refresh -- --discovery
      - run: npm run validate:catalog
      - run: npm run build
      - name: Publish checked source snapshot
        run: |
          if git diff --quiet -- lib/data/offer-snapshot.json lib/data/offer-url-history.json; then exit 0; fi
          git config user.name "saasfolio-catalog[bot]"
          git config user.email "saasfolio-catalog[bot]@users.noreply.github.com"
          git add lib/data/offer-snapshot.json lib/data/offer-url-history.json
          git commit -m "Refresh source-backed SaaS offers"
          git push
