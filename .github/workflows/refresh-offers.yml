name: Refresh SaaS offers
on:
  schedule:
    - cron: "17 4,16 * * *"
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: refresh-offers
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ github.token }}
      CATALOG_BRANCH: automation/offer-refresh
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Prepare release branch
        run: |
          git config user.name "saasfolio-catalog[bot]"
          git config user.email "saasfolio-catalog[bot]@users.noreply.github.com"
          node scripts/catalog-release-pr.mjs --prepare
      - run: npm run test:unit
      - run: npm run catalog:refresh -- --discovery
      - run: npm run validate:catalog
      - run: npm run build
      - name: Open or update the checked release PR
        run: node scripts/catalog-release-pr.mjs
